<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">water-koubo 演示流程图</title>
  <desc id="desc">一篇完整参考稿经过找出爆款写法、重新创作和核对归属，得到标题、封面文字和口播正文。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e11d2e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="18" height="900" fill="#e11d2e"/>

  <rect x="88" y="72" width="270" height="46" rx="23" fill="#fff0f1"/>
  <circle cx="116" cy="95" r="7" fill="#e11d2e"/>
  <text x="136" y="103" fill="#e11d2e" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" letter-spacing="1">WATER-KOUBO · 五步成稿</text>

  <text x="88" y="192" fill="#111827" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="54" font-weight="800">给一篇爆款参考稿，直接二创成可拍口播稿</text>
  <text x="88" y="244" fill="#64748b" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25">整个过程只需要一篇完整参考稿。</text>

  <g filter="url(#shadow)">
    <rect x="88" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
    <rect x="376" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
    <rect x="664" y="338" width="248" height="268" rx="24" fill="#e11d2e"/>
    <rect x="952" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
    <rect x="1240" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#e11d2e" stroke-width="5" marker-end="url(#arrow)">
    <path d="M336 472 H365"/>
    <path d="M624 472 H653"/>
    <path d="M912 472 H941"/>
    <path d="M1200 472 H1229"/>
  </g>

  <g font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    <text x="116" y="385" fill="#e11d2e">01 · INPUT</text>
    <text x="404" y="385" fill="#e11d2e">02 · FIND</text>
    <text x="692" y="385" fill="#ffffff">03 · REMIX</text>
    <text x="980" y="385" fill="#e11d2e">04 · CHECK</text>
    <text x="1268" y="385" fill="#e11d2e">05 · OUTPUT</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="800">
    <text x="116" y="446" fill="#111827">一篇完整参考稿</text>
    <text x="404" y="446" fill="#111827">找出爆款写法</text>
    <text x="692" y="446" fill="#ffffff">重新创作</text>
    <text x="980" y="446" fill="#111827">核对归属</text>
    <text x="1268" y="446" fill="#111827">完整成稿</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" fill="#64748b">
    <text x="116" y="502">粘贴文字</text>
    <text x="116" y="536">或附上文件</text>

    <text x="404" y="502">观点 · 结构</text>
    <text x="404" y="536">案例 · 爆点</text>

    <text x="692" y="502" fill="#ffffff">开头 · 判断</text>
    <text x="692" y="536" fill="#ffffff">句子 · 细节</text>

    <text x="980" y="502">事实 · 案例</text>
    <text x="980" y="536">经历分别属于谁</text>

    <text x="1268" y="502">标题＋封面文字</text>
    <text x="1268" y="536">＋口播正文</text>
  </g>

  <rect x="88" y="700" width="1400" height="112" rx="22" fill="#e9edf4"/>
  <circle cx="130" cy="756" r="12" fill="#e11d2e"/>
  <text x="166" y="765" fill="#334155" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">一篇完整参考稿  →  标题＋封面文字＋可拍口播正文</text>
  <text x="1320" y="765" fill="#e11d2e" font-family="Arial, sans-serif" font-size="20" font-weight="700">water-koubo</text>
</svg>
