<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">water-koubo 演示流程图</title>
  <desc id="desc">给一篇爆款文案，保留爆款结构并完成原创改写，得到标题、封面文字和口播正文。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e11d2e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect x="0" y="0" width="18" height="900" fill="#e11d2e"/>

  <rect x="88" y="72" width="374" height="46" rx="23" fill="#fff0f1"/>
  <circle cx="116" cy="95" r="7" fill="#e11d2e"/>
  <text x="136" y="103" fill="#e11d2e" font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" font-weight="700" letter-spacing="1">WATER-KOUBO · 爆款口播二创</text>

  <text x="88" y="192" fill="#111827" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="54" font-weight="800">给一篇爆款文案，直接二创出稿</text>

  <g filter="url(#shadow)">
    <rect x="88" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
    <rect x="376" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
    <rect x="664" y="338" width="248" height="268" rx="24" fill="#e11d2e"/>
    <rect x="952" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
    <rect x="1240" y="338" width="248" height="268" rx="24" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#e11d2e" stroke-width="5" marker-end="url(#arrow)">
    <path d="M336 472 H365"/>
    <path d="M624 472 H653"/>
    <path d="M912 472 H941"/>
    <path d="M1200 472 H1229"/>
  </g>

  <g font-family="Arial, Microsoft YaHei, PingFang SC, sans-serif" font-size="18" font-weight="700" letter-spacing="1">
    <text x="116" y="385" fill="#e11d2e">01</text>
    <text x="404" y="385" fill="#e11d2e">02</text>
    <text x="692" y="385" fill="#ffffff">03</text>
    <text x="980" y="385" fill="#e11d2e">04</text>
    <text x="1268" y="385" fill="#e11d2e">05</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="800">
    <text x="116" y="446" fill="#111827">爆款文案</text>
    <text x="404" y="446" fill="#111827">保留爆款结构</text>
    <text x="692" y="446" fill="#ffffff">100%原创改写</text>
    <text x="980" y="446" fill="#111827">口语化成稿</text>
    <text x="1268" y="446" fill="#111827">一次出全</text>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#64748b">
    <text x="116" y="502">粘贴文字／附上文件</text>

    <text x="404" y="502" aria-label="观点、顺序、节奏、爆点">
      <tspan x="404" dy="0">观点、顺序</tspan>
      <tspan x="404" dy="34">节奏、爆点</tspan>
    </text>

    <text x="692" y="502" fill="#ffffff" aria-label="判断、句子、爆点、细节">
      <tspan x="692" dy="0">判断、句子</tspan>
      <tspan x="692" dy="34">爆点、细节</tspan>
    </text>

    <text x="980" y="502" aria-label="顺口好读、拿起来就能拍">
      <tspan x="980" dy="0">顺口好读、</tspan>
      <tspan x="980" dy="34">拿起来就能拍</tspan>
    </text>

    <text x="1268" y="502" aria-label="标题、封面文字、口播正文">
      <tspan x="1268" dy="0">标题、封面文字</tspan>
      <tspan x="1268" dy="34">口播正文</tspan>
    </text>
  </g>

  <rect x="88" y="700" width="1400" height="112" rx="22" fill="#e9edf4"/>
  <circle cx="130" cy="756" r="12" fill="#e11d2e"/>
  <text x="166" y="765" fill="#334155" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700">不限行业，所有口播创作者都能用</text>
  <text x="1320" y="765" fill="#e11d2e" font-family="Arial, sans-serif" font-size="20" font-weight="700">water-koubo</text>
</svg>
