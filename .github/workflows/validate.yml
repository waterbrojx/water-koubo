name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run static contract tests
        run: python -m unittest discover -s tests -v
